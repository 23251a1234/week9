apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedemoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubedemoapp
  template:
    metadata:
      labels:
        app: kubedemoapp
    spec:
      containers:
        - name: kubedemoapp
          image: greeshma2005/mypythonflaskapp:latest
          ports:
            - containerPort: 5000